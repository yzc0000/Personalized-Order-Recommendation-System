[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-grocery-recommender"
version = "0.1.0"
description = "Instacart next-basket reorder ranking"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "polars>=1.30,<2",
  "scipy>=1.11",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2,<4"]
catboost = ["catboost>=1.2,<2"]
analysis = ["xgboost>=2,<4", "catboost>=1.2,<2", "matplotlib>=3.8", "pandas>=2", "pyarrow>=15"]

[project.scripts]
grocery-rec = "grocery_recommender.cli:main"

[tool.setuptools.packages.find]
include = ["grocery_recommender*"]
